[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadrisk-live"
version = "0.1.0"
description = "US accident severity prediction with live weather and crash-count forecasting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
parquet = ["pyarrow>=14"]
all = ["roadrisk-live[api,parquet]"]
dev = ["pytest>=8"]

[project.scripts]
roadrisk = "roadrisk_live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadrisk_live = ["serving/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Could not find the number of physical cores:UserWarning"]
